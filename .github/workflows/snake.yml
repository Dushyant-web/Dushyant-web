name: Contribution snake

# Regenerates the animated contribution graph used in README.md and publishes it
# to the `output` branch, where the README reads it from.

on:
  schedule:
    - cron: "30 0 * * *" # daily, 00:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8C6D14&color_dots=#EBEDF0,#F1E4B8,#E2C870,#C9A43A,#8C6D14
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#D4AF37&color_dots=#161B22,#3B3220,#6B5A2C,#A68B3A,#D4AF37

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
